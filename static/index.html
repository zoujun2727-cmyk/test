<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Analytics Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1 id="dash-title">SQL Analytics Dashboard</h1>
    <nav>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="console">SQL Console</button>
    </nav>
  </header>

  <main>
    <section id="dashboard" class="view active">
      <div class="date-filter">
        <label>From <input type="date" id="filter-start" /></label>
        <label>To <input type="date" id="filter-end" /></label>
        <button id="filter-apply">Apply</button>
        <button id="filter-clear" class="secondary">Clear</button>
        <span class="note">Filters all panels backed by order date.</span>
      </div>
      <div id="panels" class="panels">
        <p class="loading">Loading dashboard…</p>
      </div>
    </section>

    <section id="console" class="view">
      <div class="console-layout">
        <aside id="schema" class="schema">
          <h3>Schema</h3>
          <div id="schema-tree">…</div>
        </aside>
        <div class="console-main">
          <textarea id="sql-input" spellcheck="false"
            placeholder="SELECT category, COUNT(*) FROM products GROUP BY category;">SELECT p.category, COUNT(*) AS products, ROUND(AVG(p.price), 2) AS avg_price
FROM products p
GROUP BY p.category
ORDER BY avg_price DESC;</textarea>
          <div class="console-actions">
            <button id="run-btn">Run query &nbsp;(Ctrl/Cmd + Enter)</button>
            <span id="query-status"></span>
          </div>
          <div id="query-result" class="query-result"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
